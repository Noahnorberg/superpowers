name: Sync upstream

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Noahnorberg/superpowers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge upstream main
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=main
      - name: Keep the schedule active during upstream inactivity
        shell: bash
        run: |
          head_date=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.commit.committer.date')
          if (( $(date -u +%s) - $(date -u --date="$head_date" +%s) < 30 * 86400 )); then
            exit 0
          fi

          path="repos/$GITHUB_REPOSITORY/contents/.github/upstream-sync-heartbeat.txt"
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/main:.github")
          current_sha=$(jq -r '.tree[] | select(.path == "upstream-sync-heartbeat.txt") | .sha' <<< "$metadata")
          content=$(date -u +%FT%TZ | base64 -w 0)
          fields=(-f branch=main -f 'message=Keep upstream sync active' -f "content=$content")
          if [[ -n "$current_sha" ]]; then
            fields+=(-f "sha=$current_sha")
          fi
          gh api --method PUT "$path" "${fields[@]}" --jq '.commit.sha'
